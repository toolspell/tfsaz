# The live-test bed: the Azure DevOps Server mock, the DNS sinkhole and the
# router that connects VMs. Start an instance with `go run ./tools/live up`.
name: ${TFSAZ_LIVE_PROJECT:?run tools/live up}

services:
  devops-server-mock:
    build: ./devops-server-mock
    environment:
      MOCK_PAT: ${MOCK_PAT:-mock-pat}
      MOCK_PUBLISHED_HTTP_PORT: ${TFSAZ_LIVE_HTTP_PORT:?}
      MOCK_PUBLISHED_HTTPS_PORT: ${TFSAZ_LIVE_HTTPS_PORT:?}
      MOCK_PUBLISHED_SSH_PORT: ${TFSAZ_LIVE_SSH_PORT:?}
    volumes:
      # The mock writes its SSH client key, known_hosts and CA certificate here.
      - type: bind
        source: ${TFSAZ_LIVE_STATE:?}/mock-keys
        target: /keys
        bind:
          create_host_path: false
    # Loopback only: VMs reach the mock through the router, and nobody else
    # on the network should change its state.
    ports:
      - "127.0.0.1:${TFSAZ_LIVE_HTTP_PORT:?}:8080"
      - "127.0.0.1:${TFSAZ_LIVE_HTTPS_PORT:?}:8443"
      - "127.0.0.1:${TFSAZ_LIVE_SSH_PORT:?}:2222"
      - "127.0.0.1:${TFSAZ_LIVE_JOURNAL_PORT:?}:19090"
    dns: ${TFSAZ_LIVE_DNS_IP:?}
    networks:
      bed:
        ipv4_address: ${TFSAZ_LIVE_MOCK_IP:?}

  dns:
    image: coredns/coredns:1.12.1
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - type: bind
        source: ${TFSAZ_LIVE_STATE:?}/Corefile
        target: /etc/coredns/Corefile
        read_only: true
        bind:
          create_host_path: false
    networks:
      bed:
        ipv4_address: ${TFSAZ_LIVE_DNS_IP:?}

  router:
    build: ./router
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.proxy_arp: "1"
    environment:
      BED_SUBNET: ${TFSAZ_LIVE_SUBNET:?}
      MOCK_IP: ${TFSAZ_LIVE_MOCK_IP:?}
      DNS_IP: ${TFSAZ_LIVE_DNS_IP:?}
      VM_SUBNET: ${TFSAZ_LIVE_VM_SUBNET:?}
    volumes:
      - type: bind
        source: ${TFSAZ_LIVE_STATE:?}/router
        target: /state
        bind:
          create_host_path: false
    ports:
      - "${TFSAZ_LIVE_WIREGUARD_PORT:?}:51820/udp"
    healthcheck:
      test: ["CMD-SHELL", "test -s /state/public.key && pidof dnsmasq"]
      interval: 1s
      timeout: 2s
      retries: 10
    networks:
      bed:
        ipv4_address: ${TFSAZ_LIVE_ROUTER_IP:?}

networks:
  bed:
    ipam:
      config:
        # Containers get addresses from the lower half; VMs joined through
        # the router use the upper half.
        - subnet: ${TFSAZ_LIVE_SUBNET:?}
          ip_range: ${TFSAZ_LIVE_CONTAINER_SUBNET:?}
          gateway: ${TFSAZ_LIVE_GATEWAY:?}

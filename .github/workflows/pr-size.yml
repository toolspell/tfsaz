# Measures each PR's effective changed lines and net test functions; pr-size-apply.yml writes the
# size label and the test delta comment from the result. See .github/scripts/pr-size.cjs. Adapted
# from Toolspell's pr-size.yml, itself adapted from T3 Code's pr-size.yml (MIT).
#
# A read-only token, also for fork PRs, so the PR's code may run here. The write token lives only
# in pr-size-apply.yml, which runs default-branch code. pull_request_target is not used.
name: PR size

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

# Run level, not job level: a run joins the group when its event arrives, so a newer push always
# supersedes an older one. A job joins only when it is queued, not always in event order, so an
# older push's job could cancel the newer one's and measure a stale diff.
concurrency:
  group: pr-size-measure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure PR size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history for the merge base.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Event values go through the environment, never into the script text.
      - name: Measure changed lines and test delta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RESULT_FILE: ${{ runner.temp }}/pr-size.json
        run: node .github/scripts/pr-size.cjs

      # Unarchived, so Apply never extracts a zip; the artifact is named pr-size.json.
      - name: Upload result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/pr-size.json
          archive: false
          if-no-files-found: error
          retention-days: 1

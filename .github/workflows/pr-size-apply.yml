# Writes the size label and the test delta comment from a successful pr-size.yml run. See
# .github/scripts/pr-size.cjs.
#
# workflow_run has a write token and runs the default branch's workflow. The checkout is the
# default branch; the artifact is untrusted data, bound to the PR before anything is written.
# Never check out or run PR code here, and never add installs, builds, tests, or caches.
name: PR size apply

on:
  workflow_run:
    workflows: [PR size]
    types: [completed]

permissions: {}

# No concurrency group: runs can complete out of push order, so a late, stale run could cancel the
# current one. Each run instead writes only when the PR's head and base are still what it measured.

jobs:
  apply:
    name: Apply PR size
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Never extracted: a zip under this name stays one file and fails the size or JSON check.
      - name: Download result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-size.json
          path: ${{ runner.temp }}/pr-size
          skip-decompress: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Sync size label and test delta comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./.github/scripts/pr-size.cjs").apply({
              github,
              context,
              core,
              file: `${process.env.RUNNER_TEMP}/pr-size/pr-size.json`,
            });

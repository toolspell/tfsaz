# Change detection, the whole-tree checks on Linux, the native test matrix on macOS, Windows and
# Ubuntu, and one roll-up job, Check, for a ruleset to require. The roll-up pattern is adapted from
# T3 Code's CI (MIT), by way of Toolspell. docs/operations/development.md#ci describes the layout.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# One group per pull request or per commit on main, so a burst of pushes to main does not cancel the
# runs of the commits in between.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # What the Changes job compares against to decide whether the test matrix runs: a pull request's
  # merge commit has the base as its first parent; a merge queue group compares against the base it
  # was built on, so a group of several PRs counts all their files; a push compares against the
  # previous head of main. Empty on a manual run, which runs the tests.
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
  # Only a push to main saves caches; pull requests and merge queue groups restore main's. A branch's
  # own caches would count against the 10 GB limit and evict main's, and only that branch could
  # restore them.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push can carry several commits, so the previous head may be further back than one.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # tools/dev uses only the standard library.
          cache: false
      - id: changes
        run: go run ./tools/dev ci-changes -base "$BASE"

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the whole history, including commits made without the hook.
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # govulncheck judges the standard library of the Go it runs on: the go.mod minimum that
          # every build uses at least.
          go-version-file: go.mod
          # Restored and saved below, so only main saves.
          cache: false
      # The build cache keeps the compiled tools, which are most of a cold run.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.GOCACHE }}
            ${{ steps.go.outputs.GOMODCACHE }}
          key: go-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'live-tests/devops-server-mock/go.sum', 'tools/*/go.sum') }}
          restore-keys: go-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - id: lint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ steps.go.outputs.go-version }}-${{ hashFiles('.golangci.yml', 'go.sum', 'live-tests/devops-server-mock/go.sum', 'tools/golangci-lint/go.sum') }}
          restore-keys: golangci-lint-${{ steps.go.outputs.go-version }}-
      # vet, golangci-lint, govulncheck and deadcode run once per GOOS (darwin, linux, windows) in
      # the root module and in the live-test mock's module.
      - run: go run ./tools/dev ci-checks
      - if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.GOCACHE }}
            ${{ steps.go.outputs.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - if: env.SAVE_CACHE == 'true' && steps.lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # The tests run one after another, and Windows runs the Git-heavy ones about five times
        # slower than Ubuntu, so its tests are split across three runners.
        include:
          - {os: macos-latest, shard: 1/1}
          - {os: ubuntu-latest, shard: 1/1}
          - {os: windows-latest, shard: 1/3}
          - {os: windows-latest, shard: 2/3}
          - {os: windows-latest, shard: 3/3}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.GOCACHE }}
            ${{ steps.go.outputs.GOMODCACHE }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'live-tests/devops-server-mock/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - run: go run ./tools/dev ci-test -shard ${{ matrix.shard }}
      # The Windows shards share one key; the first to finish saves it.
      - if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.GOCACHE }}
            ${{ steps.go.outputs.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  check:
    name: Check
    if: ${{ always() }}
    needs: [changes, checks, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed, or the tests were skipped because no code changed
        env:
          RESULTS: ${{ toJSON(needs) }}
          TESTS_NEEDED: ${{ needs.changes.outputs.tests }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e --arg tests "$TESTS_NEEDED" '
            .changes.result == "success" and .checks.result == "success"
            and (.test.result == "success" or (.test.result == "skipped" and $tests == "false"))'

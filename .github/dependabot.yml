# Weekly grouped updates for the Go module, the pinned tool modules, the SHA-pinned workflow actions and the test bed base images.
# Commit types follow the repo's conventional commits: go.mod and go.sum are build
# inputs ("build(deps): bump ..."), workflow pins are CI ("ci(deps): bump ...").
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    # A compromised release is usually pulled within days; take none younger than a week.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    # Replaces Dependabot's default labels, which .github/labels.json does not define.
    labels: ["dependencies"]

  # The pinned developer tools, one module each (docs/operations/development.md#pinned-tools).
  # Only the tool itself moves, so its indirect dependencies stay those of its release.
  - package-ecosystem: gomod
    directories:
      - "/tools/act"
      - "/tools/actionlint"
      - "/tools/deadcode"
      - "/tools/gitleaks"
      - "/tools/golangci-lint"
      - "/tools/govulncheck"
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    labels: ["dependencies"]

  # The test bed images' base images, pinned as tag@digest; a bump changes their input keys.
  - package-ecosystem: docker
    directories:
      - "/live-tests/devops-server-mock"
      - "/live-tests/router"
    schedule:
      interval: weekly
    groups:
      testbed-images:
        patterns: ["*"]
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    labels: ["dependencies"]

  - package-ecosystem: docker-compose
    directory: "/live-tests"
    schedule:
      interval: weekly
    groups:
      testbed-compose:
        patterns: ["*"]
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    labels: ["dependencies"]
